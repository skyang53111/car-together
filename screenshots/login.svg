<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844"
     font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF1FA"/>
      <stop offset="100%" stop-color="#F8F9FD"/>
    </linearGradient>
    <linearGradient id="brand2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.84"/>
    </linearGradient>
    <filter id="sh3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1E1B4B" flood-opacity="0.12"/>
    </filter>
    <filter id="sh4" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#4338CA" flood-opacity="0.28"/>
    </filter>
    <clipPath id="screen2"><rect x="0" y="0" width="390" height="844" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#screen2)">
    <rect width="390" height="844" fill="url(#bg2)"/>
    <circle cx="320" cy="90" r="170" fill="#C7D2FE" opacity="0.50"/>
    <circle cx="20" cy="430" r="150" fill="#A5F3FC" opacity="0.30"/>
    <circle cx="370" cy="720" r="150" fill="#DDD6FE" opacity="0.40"/>

    <!-- 状态栏 -->
    <text x="26" y="30" font-size="13" font-weight="700" fill="#0F172A">9:41</text>
    <g fill="#0F172A">
      <rect x="316" y="20" width="3" height="10" rx="1.5" opacity=".9"/>
      <rect x="322" y="17" width="3" height="13" rx="1.5" opacity=".9"/>
      <rect x="328" y="14" width="3" height="16" rx="1.5" opacity=".9"/>
      <rect x="336" y="16" width="14" height="12" rx="4" fill="none" stroke="#0F172A" stroke-width="1.4" opacity=".55"/>
      <rect x="338" y="18" width="8" height="8" rx="2" opacity=".9"/>
      <rect x="355" y="18" width="14" height="8" rx="2.5" opacity=".9"/>
    </g>

    <!-- 顶部导航 -->
    <rect x="16" y="52" width="30" height="30" rx="10" fill="url(#brand2)"/>
    <g transform="translate(21,57)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12h1.4M15 12h1.4"/>
      <path d="M4 12V8.2c0-.5.4-.9.9-1L6 7l1.6-2.2c.2-.3.6-.5 1-.5h4.8c.4 0 .8.2 1 .5L16 7l1.1.2c.5.1.9.5.9 1V12"/>
      <circle cx="6.4" cy="12.2" r="1.5"/>
      <circle cx="12.6" cy="12.2" r="1.5"/>
    </g>
    <text x="54" y="73" font-size="16" font-weight="700" fill="#0F172A">校区拼车</text>

    <!-- 卡片 -->
    <g filter="url(#sh3)">
      <rect x="16" y="212" width="358" height="404" rx="22" fill="url(#glass2)" stroke="#FFFFFF" stroke-width="1.2"/>
    </g>

    <text x="44" y="272" font-size="23" font-weight="800" fill="#0F172A" letter-spacing="-0.4">欢迎回来</text>
    <text x="44" y="297" font-size="12.5" fill="#64748B">登录校区拼车平台，看看今天谁和你同路</text>

    <!-- 账号输入 -->
    <text x="44" y="336" font-size="12.5" font-weight="600" fill="#334155">手机号 / 邮箱</text>
    <rect x="44" y="346" width="302" height="48" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/>
    <g transform="translate(60,362)" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="7" cy="6.4" r="3.2"/><path d="M2 14.4a5.4 5.4 0 0 1 10.8 0"/>
    </g>
    <text x="80" y="376" font-size="13.5" fill="#94A3B8">输入手机号或邮箱</text>

    <!-- 密码输入 -->
    <text x="44" y="424" font-size="12.5" font-weight="600" fill="#334155">密码</text>
    <rect x="44" y="434" width="302" height="48" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/>
    <g transform="translate(60,450)" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1.6" y="6.4" width="11.2" height="7" rx="2"/>
      <path d="M4 6.4V4.6a3.2 3.2 0 0 1 6.4 0v1.8"/>
    </g>
    <text x="80" y="464" font-size="13.5" fill="#94A3B8">输入密码</text>
    <g transform="translate(316,452)" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round">
      <path d="M1.4 6.6S4 2.4 7.4 2.4s6 4.2 6 4.2-2.6 4.2-6 4.2-6-4.2-6-4.2Z"/>
      <circle cx="7.4" cy="6.6" r="1.8"/>
    </g>

    <!-- 登录按钮 -->
    <g filter="url(#sh4)">
      <rect x="44" y="506" width="302" height="48" rx="13" fill="url(#brand2)"/>
    </g>
    <text x="195" y="536" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">登录</text>

    <!-- 辅助链接 -->
    <text x="44" y="584" font-size="12.5" fill="#64748B">忘记密码？</text>
    <text x="346" y="584" font-size="12.5" font-weight="600" fill="#4338CA" text-anchor="end">没有账号？注册</text>

    <!-- 底部说明 -->
    <text x="195" y="672" font-size="11.5" fill="#94A3B8" text-anchor="middle">登录即表示同意平台的使用约定</text>
    <text x="195" y="694" font-size="11.5" fill="#94A3B8" text-anchor="middle">同学之间的通勤互助 · 不涉及营运</text>

    <rect x="160" y="826" width="70" height="4" rx="2" fill="#0F172A" opacity=".25"/>
  </g>
</svg>
