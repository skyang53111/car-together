<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640"
     font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif">
  <defs>
    <linearGradient id="sbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1000" height="640" fill="#F9FAFB"/>

  <!-- 侧边栏 -->
  <rect width="240" height="640" fill="#111827"/>
  <text x="20" y="42" font-size="17" font-weight="700" fill="#FFFFFF">⚙️ 后台管理</text>
  <line x1="0" y1="62" x2="240" y2="62" stroke="#374151"/>

  <rect x="0" y="78" width="240" height="42" fill="#1F2937"/>
  <rect x="0" y="78" width="3" height="42" fill="#818CF8"/>
  <text x="20" y="105" font-size="14" font-weight="600" fill="#FFFFFF">📊 仪表盘</text>
  <circle cx="196" cy="99" r="10" fill="#DC2626"/>
  <text x="196" y="103" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>

  <text x="20" y="147" font-size="14" fill="#9CA3AF">👥 用户管理</text>
  <text x="20" y="189" font-size="14" fill="#9CA3AF">🚗 行程管理</text>
  <text x="20" y="231" font-size="14" fill="#9CA3AF">📌 预订管理</text>
  <text x="20" y="273" font-size="14" fill="#9CA3AF">🔧 系统配置</text>

  <line x1="0" y1="566" x2="240" y2="566" stroke="#374151"/>
  <text x="20" y="594" font-size="13" fill="#6B7280">← 返回前台</text>
  <text x="20" y="620" font-size="13" fill="#6B7280">🚪 退出登录</text>

  <!-- 主区域 -->
  <text x="268" y="50" font-size="22" font-weight="700" fill="#111827">仪表盘</text>
  <text x="972" y="48" font-size="12.5" fill="#6B7280" text-anchor="end">管理员 · 系统管理员</text>

  <!-- 统计卡片 -->
  <g filter="url(#card)">
    <rect x="268" y="76" width="164" height="112" rx="12" fill="#FFFFFF"/>
    <rect x="448" y="76" width="164" height="112" rx="12" fill="#FFFFFF"/>
    <rect x="628" y="76" width="164" height="112" rx="12" fill="#FFFFFF"/>
    <rect x="808" y="76" width="164" height="112" rx="12" fill="#FFFFFF"/>
  </g>
  <rect x="268" y="76" width="164" height="3" rx="1.5" fill="#4F46E5"/>
  <rect x="448" y="76" width="164" height="3" rx="1.5" fill="#0E9F6E"/>
  <rect x="628" y="76" width="164" height="3" rx="1.5" fill="#F59E0B"/>
  <rect x="808" y="76" width="164" height="3" rx="1.5" fill="#3B82F6"/>

  <text x="286" y="104" font-size="16">👥</text>
  <text x="286" y="140" font-size="27" font-weight="800" fill="#111827">128</text>
  <text x="286" y="160" font-size="12" fill="#6B7280">用户总数</text>
  <text x="286" y="178" font-size="11" fill="#9CA3AF">7 天新增 <tspan fill="#0E9F6E" font-weight="600">+9</tspan></text>

  <text x="466" y="104" font-size="16">🚗</text>
  <text x="466" y="140" font-size="27" font-weight="800" fill="#111827">36</text>
  <text x="466" y="160" font-size="12" fill="#6B7280">有效行程</text>
  <text x="466" y="178" font-size="11" fill="#9CA3AF">今日新增 <tspan fill="#0E9F6E" font-weight="600">+5</tspan></text>

  <text x="646" y="104" font-size="16">📌</text>
  <text x="646" y="140" font-size="27" font-weight="800" fill="#111827">517</text>
  <text x="646" y="160" font-size="12" fill="#6B7280">预订总数</text>
  <text x="646" y="178" font-size="11" fill="#9CA3AF">今日新增 <tspan fill="#0E9F6E" font-weight="600">+12</tspan></text>

  <text x="826" y="104" font-size="16">✅</text>
  <text x="826" y="140" font-size="27" font-weight="800" fill="#111827">94</text>
  <text x="826" y="160" font-size="12" fill="#6B7280">已完成行程</text>
  <text x="826" y="178" font-size="11" fill="#9CA3AF">累计完成</text>

  <!-- 趋势卡 -->
  <g filter="url(#card)">
    <rect x="268" y="208" width="704" height="184" rx="12" fill="#FFFFFF"/>
  </g>
  <text x="290" y="238" font-size="14.5" font-weight="700" fill="#111827">近 7 天趋势</text>
  <text x="950" y="238" font-size="11.5" fill="#9CA3AF" text-anchor="end">注册用户 · 发布行程</text>

  <line x1="290" y1="366" x2="950" y2="366" stroke="#F3F4F6"/>
  <line x1="290" y1="326" x2="950" y2="326" stroke="#F3F4F6"/>
  <line x1="290" y1="286" x2="950" y2="286" stroke="#F3F4F6"/>

  <g>
    <rect x="300" y="316" width="16" height="50" rx="5" fill="#C7D2FE"/>
    <rect x="318" y="302" width="16" height="64" rx="5" fill="url(#sbar)"/>
    <rect x="392" y="324" width="16" height="42" rx="5" fill="#C7D2FE"/>
    <rect x="410" y="310" width="16" height="56" rx="5" fill="url(#sbar)"/>
    <rect x="484" y="308" width="16" height="58" rx="5" fill="#C7D2FE"/>
    <rect x="502" y="292" width="16" height="74" rx="5" fill="url(#sbar)"/>
    <rect x="576" y="330" width="16" height="36" rx="5" fill="#C7D2FE"/>
    <rect x="594" y="286" width="16" height="80" rx="5" fill="url(#sbar)"/>
    <rect x="668" y="320" width="16" height="46" rx="5" fill="#C7D2FE"/>
    <rect x="686" y="298" width="16" height="68" rx="5" fill="url(#sbar)"/>
    <rect x="760" y="312" width="16" height="54" rx="5" fill="#C7D2FE"/>
    <rect x="778" y="278" width="16" height="88" rx="5" fill="url(#sbar)"/>
    <rect x="852" y="300" width="16" height="66" rx="5" fill="#C7D2FE"/>
    <rect x="870" y="268" width="16" height="98" rx="5" fill="url(#sbar)"/>
  </g>
  <g font-size="10.5" fill="#9CA3AF" text-anchor="middle">
    <text x="317" y="384">11-08</text>
    <text x="409" y="384">11-09</text>
    <text x="501" y="384">11-10</text>
    <text x="593" y="384">11-11</text>
    <text x="685" y="384">11-12</text>
    <text x="777" y="384">11-13</text>
    <text x="869" y="384">11-14</text>
  </g>

  <!-- 表格卡 -->
  <g filter="url(#card)">
    <rect x="268" y="412" width="704" height="200" rx="12" fill="#FFFFFF"/>
  </g>
  <text x="290" y="442" font-size="14.5" font-weight="700" fill="#111827">最近预订</text>
  <text x="950" y="442" font-size="11.5" fill="#4F46E5" text-anchor="end">查看全部 ›</text>

  <rect x="268" y="458" width="704" height="34" fill="#F9FAFB"/>
  <g font-size="11.5" fill="#6B7280">
    <text x="290" y="480">行程</text>
    <text x="520" y="480">乘客</text>
    <text x="690" y="480">状态</text>
    <text x="820" y="480">时间</text>
  </g>

  <g font-size="12.5" fill="#111827">
    <text x="290" y="518">南校区南门 → 高铁站</text>
    <text x="520" y="518">陈同学</text>
    <text x="690" y="518">已确认</text>
    <text x="820" y="518" fill="#6B7280">11-15 08:30</text>

    <text x="290" y="552">北校区西门 → 机场</text>
    <text x="520" y="552">刘同学</text>
    <text x="690" y="552">已确认</text>
    <text x="820" y="552" fill="#6B7280">11-15 13:00</text>

    <text x="290" y="586">东校区正门 → 火车站</text>
    <text x="520" y="586">赵同学</text>
    <text x="690" y="586" fill="#DC2626">已取消</text>
    <text x="820" y="586" fill="#6B7280">11-14 18:20</text>
  </g>
  <line x1="268" y1="532" x2="972" y2="532" stroke="#F3F4F6"/>
  <line x1="268" y1="566" x2="972" y2="566" stroke="#F3F4F6"/>
</svg>
